[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffcert"
version = "0.1.0"
description = "Differential-testing certificates: prove unique-sample counts and get byte-exact, shrunk mismatches."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["differential-testing", "testing", "fuzzing", "ddmin", "property-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/linluozi/diffcert"

[tool.setuptools]
packages = ["diffcert"]
